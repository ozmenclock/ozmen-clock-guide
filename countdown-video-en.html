<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Countdown Clock Video Guide</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #151b22;
      --soft: #1d2630;
      --line: #2b3642;
      --text: #f3f7fb;
      --muted: #9aa8b5;
      --green: #21d07a;
      --red: #ff3030;
      --blue: #4aa3ff;
      --yellow: #ffd24a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding-bottom: 118px;
      background: radial-gradient(circle at top, #18222e 0, var(--bg) 48%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .stage {
      width: min(1100px, 100vw);
      min-height: min(620px, 100vh);
      padding: 28px;
      display: grid;
      grid-template-columns: 1fr 390px;
      gap: 28px;
      align-items: center;
    }

    .copy h1 {
      margin: 0 0 12px;
      font-size: 46px;
      line-height: 1.05;
      letter-spacing: 0;
    }

    .copy p {
      margin: 0;
      color: var(--muted);
      font-size: 21px;
      line-height: 1.45;
      white-space: pre-line;
    }

    .badge {
      display: inline-flex;
      margin-bottom: 18px;
      padding: 8px 12px;
      border: 1px solid rgba(33, 208, 122, .45);
      border-radius: 999px;
      background: rgba(33, 208, 122, .12);
      color: #8dffc5;
      font-weight: 700;
    }

    .phone {
      width: 390px;
      min-height: 700px;
      padding: 14px;
      border: 1px solid #303b47;
      border-radius: 32px;
      background: #05080c;
      box-shadow: 0 28px 60px rgba(0, 0, 0, .45);
      overflow: hidden;
    }

    .screen {
      min-height: 670px;
      border: 1px solid #223041;
      border-radius: 20px;
      background: #0b0f14;
      overflow: hidden;
    }

    .statusbar {
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      color: #c7d7e6;
      font-size: 12px;
      background: #06101a;
    }

    .home,
    .settings-page,
    .browser-shell,
    .countdown-page,
    .setup-preview {
      min-height: 644px;
      padding: 14px;
      background: #0c1117;
    }

    .shot-page {
      min-height: 644px;
      height: 644px;
      overflow: hidden;
      background: #060a0f;
    }

    .settings-shot {
      width: 100%;
      height: auto;
      display: block;
      animation: shotPan 7.6s ease-in-out both;
    }

    @keyframes shotPan {
      0%, 16% { transform: translateY(var(--shot-start, 0)); }
      84%, 100% { transform: translateY(var(--shot-end, calc(644px - 100%))); }
    }

    .home-time {
      margin: 28px 0 24px;
      text-align: center;
      font-size: 42px;
      font-weight: 800;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 10px;
    }

    .app-icon {
      display: grid;
      justify-items: center;
      gap: 7px;
      color: #dbe9f6;
      font-size: 12px;
      text-align: center;
    }

    .icon-box {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: white;
      font-weight: 800;
      font-size: 22px;
    }

    .settings-app { background: linear-gradient(135deg, #667788, #1d2935); }
    .browser-app { background: linear-gradient(135deg, #39a7ff, #005bd1); }
    .clock-app { background: linear-gradient(135deg, #242a32, #000); }
    .mail-app { background: linear-gradient(135deg, #1fc777, #0f7a45); }

    .tap {
      outline: 3px solid var(--green);
      box-shadow: 0 0 18px rgba(33, 208, 122, .55);
    }

    .page-title {
      margin: 8px 2px 18px;
      font-size: 27px;
      font-weight: 800;
    }

    .settings-row,
    .wifi-row {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }

    .settings-row span,
    .wifi-row span,
    .small,
    .caption {
      color: #9fb4c8;
      font-size: 12px;
      line-height: 1.35;
    }

    .mini-icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: #173b57;
      color: #9bd5ff;
      font-weight: 800;
    }

    .password-box,
    .browser-card,
    .setup-card-demo,
    .card {
      margin-bottom: 12px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }

    .password-field,
    .browser-url,
    .setup-field-demo,
    input,
    select {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0d141c;
      color: var(--text);
      font: inherit;
    }

    .phone-button,
    .tab,
    .btn {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #1f2a35;
      color: #eef7ff;
      text-align: center;
      font-weight: 800;
    }

    .phone-button.primary,
    .btn.primary,
    .tab.active {
      border-color: var(--green);
      background: rgba(33, 208, 122, .15);
      color: #8dffc5;
    }

    .browser-top {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
    }

    .browser-url {
      margin-top: 0;
      font-weight: 800;
      color: #9bd5ff;
    }

    .setup-preview h2,
    .countdown-page h2 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .setup-note-demo {
      margin-top: 8px;
      padding: 9px;
      border-left: 4px solid var(--green);
      background: rgba(33, 208, 122, .08);
      color: #b7cce0;
      font-size: 12px;
      line-height: 1.35;
    }

    .preview {
      margin-bottom: 14px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .info-row {
      display: grid;
      grid-template-columns: 1fr 1.45fr;
      gap: 8px;
      margin-bottom: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #1b232c;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .time-box {
      padding: 11px 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #1b232c;
      text-align: center;
    }

    .time-box b {
      display: block;
      color: #62ffc0;
      font-size: 30px;
      line-height: 1;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab {
      min-height: 42px;
      padding: 10px 4px;
      font-size: 13px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .wifi-demo-grid .info-row {
      grid-template-columns: 1fr;
      gap: 3px;
      min-width: 0;
    }

    .wifi-demo-grid .info-row b {
      font-size: 14px;
      line-height: 1.15;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }

    .color-strip {
      height: 42px;
      border: 1px solid #4a5a68;
      border-radius: 10px;
      background: #00ff00;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .06);
    }

    .status {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #1b232c;
      font-weight: 800;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 14px var(--green);
    }

    .scene-nav {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 14px;
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 8px;
      max-height: 88px;
      overflow: auto;
      padding: 10px 12px;
      border: 1px solid rgba(43, 54, 66, .9);
      border-radius: 12px;
      background: rgba(6, 10, 15, .94);
      z-index: 30;
    }

    .scene-jump {
      min-height: 50px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(21, 27, 34, .86);
      color: #cfe3f4;
      cursor: pointer;
      text-align: left;
      font: inherit;
      font-size: 12px;
      line-height: 1.2;
    }

    .scene-jump b {
      display: block;
      color: white;
      font-size: 13px;
      margin-bottom: 2px;
    }

    .scene-jump.active {
      border-color: var(--green);
      background: rgba(33, 208, 122, .16);
      color: #8dffc5;
    }

    .controls {
      position: fixed;
      right: 18px;
      top: 18px;
      display: flex;
      gap: 8px;
      z-index: 40;
    }

    .controls button {
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #1d2630;
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
    }

    .progress {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: rgba(255, 255, 255, .08);
      z-index: 50;
    }

    .progress span {
      display: block;
      width: 0;
      height: 100%;
      background: var(--green);
    }

    @media (max-width: 820px) {
      body {
        display: block;
        padding-bottom: 128px;
      }

      .stage {
        grid-template-columns: 1fr;
        padding: 18px;
      }

      .copy h1 { font-size: 34px; }
      .copy p { font-size: 17px; }
      .phone { width: min(390px, calc(100vw - 36px)); margin: 0 auto; }
      .scene-nav { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="controls">
    <button type="button" onclick="restart()">Restart</button>
    <button type="button" onclick="togglePause()" id="pauseBtn">Pause</button>
  </div>

  <main class="stage">
    <section class="copy">
      <div class="badge">Ozmen Countdown</div>
      <h1 id="title"></h1>
      <p id="text"></p>
    </section>

    <section class="phone">
      <div class="screen" id="screen"></div>
    </section>
  </main>

  <nav class="scene-nav" id="sceneNav"></nav>
  <div class="progress"><span id="progress"></span></div>

  <script>
    const scenes = [
      {
        title: "Start from the phone home screen",
        nav: "Home",
        type: "home",
        tap: "settings",
        text: "Power on the countdown clock and wait until the LED display turns on.\n\nFor first setup, open the WiFi settings on your phone or computer. The clock WiFi network does not provide internet; it is used only to open the setup page."
      },
      {
        title: "Open WiFi settings",
        nav: "WiFi",
        type: "settings",
        tap: "wifi",
        text: "Open the WiFi list on your phone.\n\nThe network named COUNTDOWN-XXXXXX belongs to the countdown clock. The XXXXXX part is different for each device."
      },
      {
        title: "Select the countdown WiFi network",
        nav: "Network",
        type: "wifiList",
        tap: "clockWifi",
        text: "Select the COUNTDOWN-XXXXXX network.\n\nYour phone may show a no internet warning. This is normal because this network is only for the countdown clock setup panel."
      },
      {
        title: "Enter the device WiFi password",
        nav: "Password",
        type: "password",
        text: "The default device WiFi password is 12345678.\n\nAfter entering the password, the phone connects to the countdown clock WiFi. Then open 192.168.4.1 in the browser."
      },
      {
        title: "Open 192.168.4.1",
        nav: "Address",
        type: "browserAddress",
        text: "Open the internet browser and type 192.168.4.1 into the address bar.\n\nThis address opens the countdown clock settings page. 192.168.4.1 and 192.168.4.1/index.html open the same page."
      },
      {
        title: "First setup screen",
        nav: "First setup",
        type: "firstSetup",
        text: "On the first setup screen, choose language, time zone and home WiFi settings.\n\nChanging the device WiFi password is optional. If you do not change it, the default password remains 12345678. Home WiFi allows the device to update time using NTP."
      },
      {
        title: "Set the countdown target",
        nav: "Countdown",
        type: "image",
        tab: "Countdown",
        card: "countdown",
        image: "assets/countdown-video-live/en-countdown.png",
        panStart: 0,
        panEnd: -600,
        text: "Use the Countdown tab to set the target date and target time.\n\nAfter saving the target, the device calculates the remaining time automatically. The display layout changes according to the selected model."
      },
      {
        title: "Color and digit colors",
        nav: "Color",
        type: "image",
        tab: "Color",
        card: "color",
        image: "assets/countdown-video-live/en-color.png",
        panStart: 0,
        panEnd: -2387,
        text: "The Color tab controls solid color, presets, brightness and color profiles.\n\nWhen per-digit colors are enabled, each digit or section can use its own color. Color profiles such as Rainbow, Aurora and Lava add animated effects."
      },
      {
        title: "WiFi and time update",
        nav: "WiFi",
        type: "image",
        tab: "WiFi",
        card: "wifi",
        image: "assets/countdown-video-live/en-wifi.png",
        panStart: 0,
        panEnd: -738,
        text: "The WiFi tab shows the connected network, local IP address, signal and connection status.\n\nIf the home WiFi changes, select the new network here and save it. A brief disconnection during connection is normal."
      },
      {
        title: "Night light settings",
        nav: "Night",
        type: "image",
        tab: "Night Light",
        card: "night",
        image: "assets/countdown-video-live/en-night-light.png",
        panStart: 0,
        panEnd: -227,
        text: "Night Light automatically lowers brightness during selected hours.\n\nLower brightness is more comfortable in bedrooms or dark rooms."
      },
      {
        title: "Tools and LED test",
        nav: "Tools",
        type: "image",
        tab: "Tools",
        card: "tools",
        image: "assets/countdown-video-live/en-tools.png",
        panStart: 0,
        panEnd: -639,
        text: "The Tools tab includes first setup, LED test, firmware update and factory reset.\n\nYou can use LED test to check the LEDs. Factory reset clears saved WiFi information and settings."
      }
    ];

    const tabs = ["Countdown", "Color", "WiFi", "Night Light", "Tools"];
    const sceneMs = 7600;
    let startedAt = Date.now();
    let paused = false;
    let pauseAt = 0;
    let timer = null;
    let activeSceneIndex = -1;

    function statusbar() {
      return `<div class="statusbar"><b>12:23</b><span>WiFi 100%</span></div>`;
    }

    function homeScreen(scene) {
      const settingsTap = scene.tap === "settings" ? " tap" : "";
      const browserTap = scene.tap === "browser" ? " tap" : "";
      return `${statusbar()}
        <div class="home">
          <div class="home-time">12:23</div>
          <div class="app-grid">
            <div class="app-icon${settingsTap}"><div class="icon-box settings-app">S</div><span>Settings</span></div>
            <div class="app-icon${browserTap}"><div class="icon-box browser-app">B</div><span>Internet Browser</span></div>
            <div class="app-icon"><div class="icon-box clock-app">C</div><span>Clock</span></div>
            <div class="app-icon"><div class="icon-box mail-app">M</div><span>Messages</span></div>
          </div>
        </div>`;
    }

    function settingsScreen(scene) {
      const wifiTap = scene.tap === "wifi" ? " tap" : "";
      return `${statusbar()}
        <div class="settings-page">
          <div class="page-title">Settings</div>
          <div class="settings-row${wifiTap}"><div class="mini-icon">W</div><div><b>WiFi</b><span>Wireless networks</span></div><div>></div></div>
          <div class="settings-row"><div class="mini-icon">B</div><div><b>Bluetooth</b><span>Off</span></div><div>></div></div>
          <div class="settings-row"><div class="mini-icon">E</div><div><b>Display</b><span>Brightness and theme</span></div><div>></div></div>
        </div>`;
    }

    function wifiListScreen(scene) {
      const clockTap = scene.tap === "clockWifi" ? " tap" : "";
      return `${statusbar()}
        <div class="settings-page">
          <div class="page-title">WiFi</div>
          <div class="wifi-row${clockTap}"><div class="mini-icon">C</div><div><b>COUNTDOWN-A4E28A</b><span>Countdown setup network - Password: 12345678</span></div><div>***</div></div>
          <div class="wifi-row"><div class="mini-icon">H</div><div><b>Home_WiFi</b><span>Secured network</span></div><div>***</div></div>
          <div class="wifi-row"><div class="mini-icon">O</div><div><b>Ofis_WiFi</b><span>Secured network</span></div><div>**</div></div>
        </div>`;
    }

    function passwordScreen() {
      return `${statusbar()}
        <div class="settings-page">
          <div class="page-title">COUNTDOWN-A4E28A</div>
          <div class="password-box">
            <label>Default device WiFi password</label>
            <div class="password-field">12345678</div>
          </div>
          <div class="phone-button primary">Connect</div>
        </div>`;
    }

    function browserAddressScreen() {
      return `${statusbar()}
        <div class="browser-shell">
          <div class="browser-top">
            <div>&lt;</div>
            <div class="browser-url tap">192.168.4.1</div>
            <div>Git</div>
          </div>
          <div class="browser-card"><b>Address bar</b><p>When your phone is connected to the countdown clock WiFi, this address opens the setup page.</p></div>
          <div class="browser-card"><b>Setup address</b><p>192.168.4.1</p></div>
        </div>`;
    }

    function firstSetupScreen() {
      return `<div class="setup-preview">
        <h2>First setup</h2>
        <p>Set the time zone, optional device WiFi password, and home WiFi connection here.</p>
        <div class="setup-card-demo">
          <b>Region and time</b>
          <div class="setup-field-demo">Turkey / UTC+3</div>
        </div>
        <div class="setup-card-demo">
          <b>Device WiFi password</b>
          <p>Leave this empty if you do not want to change it. The default password remains 12345678.</p>
        </div>
        <div class="setup-card-demo">
          <b>Home WiFi connection</b>
          <div class="setup-field-demo">Home_WiFi_****</div>
          <div class="setup-field-demo">WiFi password</div>
          <div class="setup-note-demo">A brief disconnection can happen while connecting. This is normal.</div>
          <div class="phone-button primary" style="margin-top:10px">Save and Continue</div>
        </div>
      </div>`;
    }

    function renderTabs(active) {
      return tabs.map((tab) => `<div class="tab ${tab === active ? "active" : ""}">${tab}</div>`).join("");
    }

    function cardContent(kind) {
      if (kind === "countdown") return `
        <div class="card">
          <label>Target date and time</label>
          <div class="form-grid">
            <input type="date" value="2026-12-31">
            <input type="time" value="23:59:59" step="1">
          </div>
          <div class="btn primary" style="margin-top:12px">Save Target</div>
        </div>
        <div class="card">
          <b>Update RTC from system time</b>
          <p class="small">The current phone or computer date and time is sent to the device.</p>
          <div class="info-row" style="margin-top:10px"><span>System date/time</span><b>2026-07-22 12:23:45</b></div>
          <div class="btn" style="margin-top:10px">Update from System Time</div>
        </div>`;
      if (kind === "color") return `
        <div class="card">
          <b>Custom color</b>
          <div class="color-strip" style="background:#00ff00;margin:10px 0"></div>
          <div class="btn primary">Save Color</div>
        </div>
        <div class="card">
          <b>Digit colors and color profile</b>
          <div class="form-grid" style="margin-top:10px">
            <div class="color-strip" style="background:#ff0000"></div>
            <div class="color-strip" style="background:#0000ff"></div>
            <div class="color-strip" style="background:#00ff00"></div>
            <div class="color-strip" style="background:#ff8000"></div>
          </div>
          <select><option>Rainbow</option><option>Solid</option><option>Aurora</option><option>Lava</option></select>
        </div>`;
      if (kind === "wifi") return `
        <div class="card">
          <div class="status"><span class="dot"></span><div>Home_WiFi_**** network connected<br><span>IP: 192.168.1.20</span></div></div>
          <div class="form-grid wifi-demo-grid" style="margin-top:12px">
            <div class="info-row"><span>IP address</span><b>192.168.1.20</b></div>
            <div class="info-row"><span>Signal</span><b>-56 dBm</b></div>
          </div>
        </div>
        <div class="card"><b>Home WiFi network</b><select><option>Home_WiFi_****</option></select><div class="btn primary" style="margin-top:10px">Connect and Save</div></div>`;
      if (kind === "night") return `
        <div class="card">
          <b>Night mode</b>
          <div class="form-grid" style="margin-top:10px">
            <label>Start<select><option>23</option></select></label>
            <label>End<select><option>07</option></select></label>
          </div>
          <p class="small">Night brightness: 20</p>
          <div class="btn primary">Save Night Mode</div>
        </div>`;
      return `
        <div class="card"><b>Maintenance actions</b><p class="small">First setup, LED test, update, and factory reset are available in this section.</p></div>
        <div class="btn">Open First Setup Again</div>
        <div class="btn" style="margin-top:10px">Start LED Test</div>
        <div class="btn" style="margin-top:10px">Open Firmware Update Page</div>`;
    }

    function appScreen(scene) {
      return `${statusbar()}
        <div class="countdown-page">
          <div class="preview">
            <div class="info-row"><span>RTC date/time</span><b>2026-07-22 12:23:45</b></div>
            <div class="info-row"><span>Target date/time</span><b>2026-12-31 23:59:59</b></div>
            <div class="time-grid">
              <div class="time-box"><b>162</b><span>Days</span></div>
              <div class="time-box"><b>11</b><span>Clock</span></div>
              <div class="time-box"><b>36</b><span>Minutes</span></div>
              <div class="time-box"><b>14</b><span>Seconds</span></div>
            </div>
          </div>
          <div class="tabs">${renderTabs(scene.tab)}</div>
          ${cardContent(scene.card)}
        </div>`;
    }

    function imageScreen(scene) {
      const shortClass = scene.short ? " short" : "";
      const start = Number.isFinite(scene.panStart) ? `${scene.panStart}px` : "0px";
      const end = Number.isFinite(scene.panEnd) ? `${scene.panEnd}px` : "calc(644px - 100%)";
      return `<div class="shot-page">
        <img class="settings-shot${shortClass}" src="${scene.image}" alt="${scene.title}" style="--shot-start:${start};--shot-end:${end}">
      </div>`;
    }

    function renderScreen(scene) {
      if (scene.type === "home") return homeScreen(scene);
      if (scene.type === "settings") return settingsScreen(scene);
      if (scene.type === "wifiList") return wifiListScreen(scene);
      if (scene.type === "password") return passwordScreen(scene);
      if (scene.type === "browserAddress") return browserAddressScreen(scene);
      if (scene.type === "firstSetup") return firstSetupScreen(scene);
      if (scene.type === "image") return imageScreen(scene);
      return appScreen(scene);
    }

    function renderSceneNav(activeIndex) {
      const nav = document.getElementById("sceneNav");
      nav.innerHTML = scenes.map((scene, index) => `
        <button type="button" class="scene-jump ${index === activeIndex ? "active" : ""}" onclick="jumpToScene(${index})">
          <b>${String(index + 1).padStart(2, "0")}</b>${scene.nav || scene.title}
        </button>
      `).join("");
    }

    function setActiveScene(index) {
      if (activeSceneIndex === index) return;
      activeSceneIndex = index;
      renderSceneNav(index);
      return true;
    }

    function jumpToScene(index) {
      startedAt = Date.now() - (index * sceneMs);
      paused = false;
      document.getElementById("pauseBtn").textContent = "Pause";
      clearInterval(timer);
      timer = setInterval(render, 250);
      render();
    }

    function render() {
      if (paused) return;
      const elapsed = Date.now() - startedAt;
      const index = Math.min(Math.floor(elapsed / sceneMs), scenes.length - 1);
      const scene = scenes[index];
      const sceneChanged = setActiveScene(index);
      if (sceneChanged) {
        document.getElementById("title").textContent = scene.title;
        document.getElementById("text").textContent = scene.text;
        document.getElementById("screen").innerHTML = renderScreen(scene);
      }
      document.getElementById("progress").style.width = Math.min(100, (elapsed / (sceneMs * scenes.length)) * 100) + "%";
      if (elapsed >= sceneMs * scenes.length) clearInterval(timer);
    }

    function restart() {
      startedAt = Date.now();
      paused = false;
      activeSceneIndex = -1;
      document.getElementById("pauseBtn").textContent = "Pause";
      clearInterval(timer);
      renderSceneNav(0);
      timer = setInterval(render, 250);
      render();
    }

    function togglePause() {
      paused = !paused;
      const button = document.getElementById("pauseBtn");
      if (paused) {
        pauseAt = Date.now();
        button.textContent = "Resume";
      } else {
        startedAt += Date.now() - pauseAt;
        button.textContent = "Pause";
      }
    }

    restart();
  </script>
</body>
</html>
