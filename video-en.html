<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ozmen Clock Customer Guide</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #151b22;
      --soft: #1d2630;
      --line: #2b3642;
      --text: #f3f7fb;
      --muted: #9aa8b5;
      --green: #21d07a;
      --yellow: #ffd24a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding-bottom: 118px;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #18222e 0, var(--bg) 48%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .stage {
      width: min(1100px, 100vw);
      min-height: min(620px, 100vh);
      padding: 28px;
      display: grid;
      grid-template-columns: 1fr 390px;
      gap: 28px;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      margin-bottom: 18px;
      padding: 8px 12px;
      border: 1px solid rgba(33, 208, 122, .45);
      border-radius: 999px;
      background: rgba(33, 208, 122, .12);
      color: #8dffc5;
      font-weight: 700;
    }

    .copy h1 {
      margin: 0 0 12px;
      font-size: 46px;
      line-height: 1.05;
      letter-spacing: 0;
    }

    .copy p {
      margin: 0;
      color: var(--muted);
      font-size: 21px;
      line-height: 1.45;
      white-space: pre-line;
    }

    .phone {
      width: 390px;
      min-height: 700px;
      padding: 14px;
      border: 1px solid #303b47;
      border-radius: 32px;
      background: #05080c;
      box-shadow: 0 24px 90px rgba(0, 0, 0, .55);
    }

    .screen {
      min-height: 670px;
      overflow: hidden;
      border-radius: 24px;
      background: #0b0f14;
      border: 1px solid #1f2a35;
      position: relative;
    }

    .statusbar {
      height: 30px;
      padding: 8px 18px 0;
      display: flex;
      justify-content: space-between;
      color: #dceeff;
      font-size: 12px;
      background: #080c11;
    }

    .home {
      min-height: 640px;
      padding: 26px 20px 92px;
      background:
        linear-gradient(145deg, rgba(74, 163, 255, .22), transparent 42%),
        linear-gradient(330deg, rgba(33, 208, 122, .18), transparent 48%),
        #10161f;
    }

    .home-time {
      margin: 18px 0 34px;
      font-size: 52px;
      font-weight: 800;
      line-height: 1;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px 12px;
    }

    .app-icon {
      display: grid;
      gap: 7px;
      place-items: center;
      color: white;
      font-size: 11px;
      text-align: center;
    }

    .icon-box {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: #1f2a35;
      font-size: 28px;
      font-weight: 800;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), 0 8px 18px rgba(0, 0, 0, .18);
    }

    .settings-app { background: linear-gradient(145deg, #8b98a6, #4d5965); }
    .browser-app { background: linear-gradient(145deg, #51b8ff, #1268d6); }
    .clock-app { background: linear-gradient(145deg, #ff4a4a, #9b1111); }
    .mail-app { background: linear-gradient(145deg, #56d88e, #128244); }

    .dock {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      border-radius: 22px;
      background: rgba(255, 255, 255, .12);
      backdrop-filter: blur(10px);
    }

    .tap {
      outline: 3px solid var(--yellow);
      outline-offset: 4px;
      transform: scale(1.04);
    }

    .settings-page {
      min-height: 640px;
      padding: 14px;
      background: #0c1117;
    }

    .page-title {
      margin: 8px 2px 18px;
      font-size: 27px;
      font-weight: 800;
    }

    .settings-row,
    .wifi-row {
      min-height: 56px;
      margin-bottom: 10px;
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #141c25;
    }

    .settings-row b,
    .wifi-row b {
      display: block;
      color: white;
      font-size: 15px;
    }

    .settings-row span,
    .wifi-row span {
      color: var(--muted);
      font-size: 12px;
    }

    .mini-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: #263241;
      color: white;
      font-weight: 800;
    }

    .wifi-bars {
      color: var(--green);
      font-weight: 800;
    }

    .password-box {
      margin: 18px 0 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #141c25;
    }

    .password-box label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .password-field {
      padding: 13px;
      border-radius: 10px;
      background: #080c11;
      border: 1px solid #334150;
      font-size: 18px;
      letter-spacing: 2px;
    }

    .phone-button {
      padding: 13px 15px;
      border-radius: 12px;
      text-align: center;
      background: #1477ff;
      color: white;
      font-weight: 800;
    }

    .browser-shell {
      min-height: 640px;
      background: #f1f3f4;
      color: #1f2328;
      padding: 0;
    }

    .browser-top {
      height: 68px;
      padding: 10px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid #d4d7db;
      background: #ffffff;
    }

    .browser-icons {
      display: flex;
      gap: 6px;
      color: #5f6872;
      font-weight: 800;
    }

    .browser-url {
      min-height: 38px;
      padding: 10px 13px;
      border: 2px solid #1a73e8;
      border-radius: 999px;
      background: #eef3f8;
      color: #202124;
      font-size: 15px;
      box-shadow: 0 0 0 3px rgba(26, 115, 232, .15);
    }

    .browser-go {
      width: 42px;
      height: 38px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: #1a73e8;
      color: white;
      font-weight: 800;
    }

    .browser-content {
      min-height: 572px;
      padding: 46px 22px;
      display: grid;
      align-content: start;
      gap: 16px;
      background: linear-gradient(#ffffff, #eef3f8);
    }

    .browser-card {
      padding: 18px;
      border: 1px solid #d4d7db;
      border-radius: 14px;
      background: white;
      box-shadow: 0 10px 30px rgba(31, 35, 40, .08);
    }

    .setup-preview {
      min-height: 640px;
      padding: 18px 14px;
      background: linear-gradient(180deg, #101820 0%, #0b0f14 220px);
      color: var(--text);
      overflow: hidden;
    }

    .setup-preview h2 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    .setup-preview p {
      margin: 0;
      color: var(--muted);
      line-height: 1.35;
      font-size: 13px;
    }

    .setup-card-demo {
      margin-top: 13px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #151b22;
    }

    .setup-card-demo b {
      display: block;
      margin-bottom: 7px;
    }

    .setup-field-demo {
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #334150;
      border-radius: 8px;
      background: #0b1118;
      color: #dceeff;
      font-size: 13px;
    }

    .setup-note-demo {
      margin-top: 9px;
      padding: 9px 10px;
      border: 1px solid rgba(155, 214, 255, .18);
      border-radius: 8px;
      background: rgba(155, 214, 255, .07);
      color: #b9d7ea;
      font-size: 12px;
      line-height: 1.35;
    }

    .shot-page {
      min-height: 640px;
      height: 640px;
      overflow: hidden;
      background: #060a0f;
      position: relative;
    }

    .settings-shot {
      width: 100%;
      height: auto;
      display: block;
      animation: shotPan 7.6s ease-in-out both;
    }

    @keyframes shotPan {
      0%, 16% { transform: translateY(0); }
      84%, 100% { transform: translateY(calc(640px - 100%)); }
    }

    .scene-nav {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 14px;
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      gap: 8px;
      max-height: 88px;
      overflow: auto;
      padding: 10px 12px;
      border: 1px solid rgba(43, 54, 66, .9);
      border-radius: 12px;
      background: rgba(6, 10, 15, .94);
      z-index: 30;
    }

    .scene-jump {
      min-height: 50px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(21, 27, 34, .86);
      color: #cfe3f4;
      cursor: pointer;
      text-align: left;
      font: inherit;
      font-size: 12px;
      line-height: 1.2;
    }

    .scene-jump b {
      display: block;
      color: white;
      font-size: 13px;
      margin-bottom: 2px;
    }

    .scene-jump.active {
      border-color: var(--green);
      background: rgba(33, 208, 122, .16);
      color: #8dffc5;
    }

    .progress {
      position: fixed;
      left: 0;
      bottom: 0;
      height: 5px;
      width: 0;
      background: var(--green);
      transition: width .25s linear;
    }

    .controls {
      position: fixed;
      right: 14px;
      top: 14px;
      display: flex;
      gap: 8px;
      z-index: 40;
    }

    .controls button {
      width: auto;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: #1b2530;
      cursor: pointer;
    }

    @media (max-width: 820px) {
      body {
        display: block;
        min-height: 100vh;
        padding: 64px 0 124px;
      }

      .stage {
        width: 100%;
        min-height: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: stretch;
      }

      .phone {
        order: 1;
        width: min(100%, 390px);
        min-height: 0;
        margin: 0 auto;
        padding: 10px;
        border-radius: 28px;
      }

      .screen {
        min-height: min(650px, calc(100vh - 245px));
        border-radius: 21px;
      }

      .copy {
        order: 2;
        width: min(100%, 390px);
        margin: 0 auto;
        padding: 14px;
        border: 1px solid rgba(43, 54, 66, .9);
        border-radius: 12px;
        background: rgba(21, 27, 34, .72);
      }

      .badge {
        margin-bottom: 10px;
        padding: 6px 10px;
        font-size: 13px;
      }

      .copy h1 {
        font-size: 25px;
        line-height: 1.15;
        margin-bottom: 8px;
      }

      .copy p {
        font-size: 15px;
        line-height: 1.5;
      }

      .controls {
        top: 10px;
        left: 10px;
        right: 10px;
        justify-content: flex-end;
      }

      .controls button {
        padding: 8px 10px;
        font-size: 13px;
      }

      .scene-nav {
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        grid-template-columns: none;
        gap: 8px;
        max-height: none;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 10px 12px 14px;
        border-radius: 14px 14px 0 0;
        scrollbar-width: thin;
      }

      .scene-jump {
        flex: 0 0 132px;
        min-height: 52px;
        font-size: 12px;
      }
    }

    @media (max-width: 420px) {
      .stage { padding: 10px; }
      .phone {
        padding: 8px;
        border-radius: 24px;
      }
      .screen {
        min-height: min(620px, calc(100vh - 230px));
        border-radius: 18px;
      }
      .statusbar {
        padding-left: 14px;
        padding-right: 14px;
      }
      .scene-jump { flex-basis: 118px; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="copy">
      <div class="badge" id="badge">Ozmen Clock</div>
      <h1 id="title">Digital Clock Setup</h1>
      <p id="text">Connect your phone to the clock WiFi network to open the setup page.</p>
    </section>

    <section class="phone" aria-label="Phone screen">
      <div class="screen" id="screen"></div>
    </section>
  </main>

  <div class="scene-nav" id="sceneNav" aria-label="Video chapters"></div>
  <div class="controls">
    <button type="button" onclick="restart()">Replay</button>
    <button type="button" onclick="togglePause()" id="pauseBtn">Pause</button>
  </div>
  <div class="progress" id="progress"></div>

  <script>
    const scenes = [
      {
        type: "home",
        nav: "Settings",
        title: "Start from the phone home screen",
        text: "To open the clock setup page, first connect your phone to the clock's own WiFi network.\n\nThis connection is only for setup. After connecting, your phone may show that there is no internet connection. That is normal because the phone is connected directly to the clock.",
        tap: "settings"
      },
      {
        type: "settings",
        nav: "WiFi menu",
        title: "Open WiFi settings",
        text: "Open the WiFi section from your phone settings.\n\nThis is where nearby wireless networks are listed. The clock broadcasts its own setup network so you can configure it without any extra app.",
        tap: "wifi"
      },
      {
        type: "wifiList",
        nav: "Clock WiFi",
        title: "Select the clock WiFi network",
        text: "Find the network name that starts with DIGITAL-CLOCK and select it.\n\nThe exact name may include the clock ID, for example DIGITAL-CLOCK-4FD863. This is the setup network created by the clock.",
        tap: "clockWifi"
      },
      {
        type: "password",
        nav: "Password",
        title: "Enter the clock WiFi password",
        text: "When the password screen appears, enter the default clock WiFi password and tap Connect.\n\nDefault password: 12345678\n\nDuring connection, the phone may briefly disconnect and reconnect. This is normal. After connecting, keep the phone connected to this WiFi network until the setup page is opened.",
      },
      {
        type: "home",
        nav: "Browser",
        title: "Open the internet browser",
        text: "After the phone connects to the clock WiFi network, go back to the home screen and open the internet browser.\n\nThe phone must remain connected to the clock WiFi while opening the setup page.",
        tap: "browser"
      },
      {
        type: "browserAddress",
        nav: "192.168.4.1",
        title: "Open 192.168.4.1",
        text: "Type 192.168.4.1 into the browser address bar and open it.\n\nThis is the local setup address of the digital clock. It works when the phone is connected to the clock WiFi network.",
      },
      {
        type: "firstSetup",
        nav: "First setup",
        title: "First setup screen",
        text: "If the clock has not been set up before, the first setup screen opens after entering 192.168.4.1.\n\nHere the customer selects the language, chooses the time zone region, optionally changes the device WiFi password, and connects the clock to the home WiFi network.\n\nAfter entering the information, tap Save and Continue. When setup is completed, a short confirmation message appears and the normal settings screen opens.",
      },
      {
        type: "image",
        nav: "Appearance",
        title: "Appearance settings",
        text: "The Appearance tab controls how the clock display looks.\n\nYou can choose a custom LED color, use one of the preset colors, and adjust the brightness for the room. After changing the color or brightness, tap the related Save button so the setting is stored.",
        image: "assets/video-live/en-appearance.png"
      },
      {
        type: "image",
        nav: "Digits / Profile",
        title: "Per-digit colors and color profiles",
        text: "This section is used for per-digit colors and color profiles.\n\nWhen per-digit colors are enabled, each digit group can use its own selected color. For example, the hour digits can be red, the minute digits can be blue, and the second digits can be green. The dot LED color can also be set separately.\n\nAt the bottom of the page, the Color profile option lets you choose effects such as Solid, fade, rainbow, and other animated profiles. Effect speed controls how fast the selected color animation moves. After making changes, tap Save Digit/Dot Colors or Save Color Profile.",
        image: "assets/video-live/en-appearance.png"
      },
      {
        type: "image",
        nav: "Time",
        title: "Time display settings",
        text: "The Time tab controls the way the clock displays time.\n\nYou can select 24-hour or 12-hour format. The leading zero option shows 08:45 instead of 8:45. The blinking dots option controls whether the dots blink or stay always on.",
        image: "assets/video-live/en-time.png"
      },
      {
        type: "image",
        nav: "Time",
        title: "Update Time",
        text: "If the clock date or time is wrong, use the phone or computer system time to update the clock.\n\nPress Update Time to send the current device time to the clock. If internet is not available, the clock continues with the stored time; when internet is available, NTP can update it again.",
        caption: "Press Update Time when the displayed time is wrong. This sends the phone or computer time to the clock.",
        image: "assets/video-live/en-time.png"
      },
      {
        type: "image",
        nav: "Temp",
        title: "Temperature settings",
        text: "The Temp tab is used when the temperature sensor is installed.\n\nYou can see the measured temperature, enable automatic temperature display, choose Celsius or Fahrenheit, set how often it appears, and adjust the temperature offset if needed.",
        image: "assets/video-live/en-temp.png"
      },
      {
        type: "image",
        nav: "Countdown",
        title: "Countdown mode",
        text: "Countdown mode counts down from a selected duration.\n\nEnter hours, minutes, and seconds, choose the countdown LED color, then show or start the countdown. You can pause, resume, or reset it at any time.",
        image: "assets/video-live/en-countdown.png"
      },
      {
        type: "image",
        nav: "Scoreboard",
        title: "Scoreboard mode",
        text: "Scoreboard mode is useful for games, competitions, and events.\n\nThere are three score areas: left, middle, and right. Each score can be increased or decreased with the buttons. You can also save separate colors for each score area.",
        image: "assets/video-live/en-scoreboard.png"
      },
      {
        type: "image",
        nav: "Stopwatch",
        title: "Stopwatch mode",
        text: "Stopwatch mode measures elapsed time.\n\nYou can use normal mode or lap mode. The Start, Stop, Resume, and Reset buttons control the stopwatch. You can also set a separate LED color for this mode.",
        image: "assets/video-live/en-stopwatch.png"
      },
      {
        type: "image",
        nav: "Night",
        title: "Night light mode",
        text: "Night Light mode lowers the brightness automatically during sleeping hours.\n\nChoose the start time, end time, and night brightness. This is useful for bedrooms, children's rooms, and dark environments.",
        image: "assets/video-live/en-night-light.png"
      },
      {
        type: "image",
        nav: "WiFi",
        title: "WiFi settings",
        text: "The WiFi tab is used to connect the clock to the home or office internet network.\n\nYou can see the saved network, IP address, signal level, signal quality, and connection state. The status notes explain whether the clock is connected, waiting for connection, or trying again.\n\nTo connect the clock to the internet, select your home WiFi network, enter the password, and tap Connect and Save. Red actions such as forgetting saved WiFi open a centered confirmation window first; nothing is deleted unless the action is confirmed.\n\nNote: A brief disconnection may happen while connecting to WiFi. Wait a few seconds and reopen 192.168.4.1 if needed.",
        image: "assets/video-live/en-wifi.png"
      },
      {
        type: "image",
        nav: "Tools",
        title: "Tools",
        text: "Maintenance actions are collected in the Tools tab.\n\nFrom Tools, the customer can change the device WiFi password, open the first setup screen again, open the firmware update page, start an LED test, or restore factory settings.\n\nFactory reset clears saved WiFi information and clock settings, so the clock shows a themed confirmation window before continuing. Nothing is erased unless the action is confirmed.",
        image: "assets/video-live/en-tools.png"
      }
    ];

    const sceneMs = 7600;
    let startedAt = Date.now();
    let paused = false;
    let pauseAt = 0;
    let timer = null;
    let activeSceneIndex = -1;
    let renderedSceneIndex = -1;

    function statusbar() {
      return `<div class="statusbar"><b>20:45</b><span>WiFi 100%</span></div>`;
    }

    function homeScreen(scene) {
      const settingsTap = scene.tap === "settings" ? " tap" : "";
      const browserTap = scene.tap === "browser" ? " tap" : "";
      return `${statusbar()}
        <div class="home">
          <div class="home-time">20:45</div>
          <div class="app-grid">
            <div class="app-icon${settingsTap}"><div class="icon-box settings-app">S</div><span>Settings</span></div>
            <div class="app-icon${browserTap}"><div class="icon-box browser-app">B</div><span>Internet Browser</span></div>
            <div class="app-icon"><div class="icon-box clock-app">C</div><span>Clock</span></div>
            <div class="app-icon"><div class="icon-box mail-app">M</div><span>Messages</span></div>
          </div>
          <div class="dock">
            <div class="app-icon"><div class="icon-box browser-app">B</div></div>
            <div class="app-icon"><div class="icon-box settings-app">S</div></div>
            <div class="app-icon"><div class="icon-box clock-app">C</div></div>
            <div class="app-icon"><div class="icon-box mail-app">M</div></div>
          </div>
        </div>`;
    }

    function settingsScreen(scene) {
      const wifiTap = scene.tap === "wifi" ? " tap" : "";
      return `${statusbar()}
        <div class="settings-page">
          <div class="page-title">Settings</div>
          <div class="settings-row${wifiTap}"><div class="mini-icon">W</div><div><b>WiFi</b><span>Wireless networks</span></div><div class="wifi-bars">></div></div>
          <div class="settings-row"><div class="mini-icon">B</div><div><b>Bluetooth</b><span>Off</span></div><div>></div></div>
          <div class="settings-row"><div class="mini-icon">D</div><div><b>Display</b><span>Brightness and theme</span></div><div>></div></div>
          <div class="settings-row"><div class="mini-icon">G</div><div><b>General</b><span>Phone settings</span></div><div>></div></div>
        </div>`;
    }

    function wifiListScreen(scene) {
      const clockTap = scene.tap === "clockWifi" ? " tap" : "";
      return `${statusbar()}
        <div class="settings-page">
          <div class="page-title">WiFi</div>
          <div class="wifi-row${clockTap}"><div class="mini-icon">D</div><div><b>DIGITAL-CLOCK-4FD863</b><span>Clock setup network - Password: 12345678</span></div><div class="wifi-bars">***</div></div>
          <div class="wifi-row"><div class="mini-icon">H</div><div><b>Home_WiFi</b><span>Secured network</span></div><div class="wifi-bars">***</div></div>
          <div class="wifi-row"><div class="mini-icon">O</div><div><b>Office_WiFi</b><span>Secured network</span></div><div class="wifi-bars">**</div></div>
          <div class="wifi-row"><div class="mini-icon">G</div><div><b>Guest</b><span>Open network</span></div><div class="wifi-bars">*</div></div>
        </div>`;
    }

    function passwordScreen(scene) {
      return `${statusbar()}
        <div class="settings-page">
          <div class="page-title">DIGITAL-CLOCK-4FD863</div>
          <div class="password-box">
            <label>Default WiFi password</label>
            <div class="password-field">12345678</div>
          </div>
          <div class="phone-button tap">Connect</div>
        </div>`;
    }

    function browserAddressScreen(scene) {
      return `${statusbar()}
        <div class="browser-shell">
          <div class="browser-top">
            <div class="browser-icons"><span>&lt;</span><span>&gt;</span></div>
            <div class="browser-url tap">192.168.4.1</div>
            <div class="browser-go">Go</div>
          </div>
          <div class="browser-content">
            <div class="browser-card">
              <b>Address bar</b>
              <p>When your phone is connected to the clock WiFi, this address opens the setup page.</p>
            </div>
            <div class="browser-card">
              <b>Setup address</b>
              <p>192.168.4.1</p>
            </div>
          </div>
        </div>`;
    }

    function firstSetupScreen(scene) {
      return `<div class="setup-preview">
        <h2>First setup</h2>
        <p>Choose the clock region, optionally change the device WiFi password, then connect the clock to home WiFi.</p>
        <div class="setup-card-demo">
          <b>Region and time</b>
          <div class="setup-field-demo">United Kingdom / London</div>
        </div>
        <div class="setup-card-demo">
          <b>Device WiFi password</b>
          <p>Keep the default password or enter a new password.</p>
          <div class="setup-field-demo">12345678</div>
        </div>
        <div class="setup-card-demo">
          <b>Home WiFi connection</b>
          <div class="setup-field-demo">Home_WiFi</div>
          <div class="setup-field-demo">WiFi password</div>
          <div class="setup-note-demo">A brief disconnection may happen while connecting to WiFi. This is normal.</div>
          <div class="phone-button tap" style="margin-top:10px">Save and continue</div>
          <div class="setup-note-demo">Setup completed. Settings saved.</div>
        </div>
      </div>`;
    }

    function imageScreen(scene) {
      const shortClass = scene.short ? " short" : "";
      return `<div class="shot-page">
          <img class="settings-shot${shortClass}" src="${scene.image}" alt="${scene.title}">
        </div>`;
    }

    function renderScreen(scene) {
      if (scene.type === "home") return homeScreen(scene);
      if (scene.type === "settings") return settingsScreen(scene);
      if (scene.type === "wifiList") return wifiListScreen(scene);
      if (scene.type === "password") return passwordScreen(scene);
      if (scene.type === "browserAddress") return browserAddressScreen(scene);
      if (scene.type === "firstSetup") return firstSetupScreen(scene);
      return imageScreen(scene);
    }

    function renderSceneNav(activeIndex) {
      const nav = document.getElementById("sceneNav");
      nav.innerHTML = scenes.map((scene, index) => `
        <button type="button" class="scene-jump ${index === activeIndex ? "active" : ""}" onclick="jumpToScene(${index})">
          <b>${String(index + 1).padStart(2, "0")}</b>${scene.nav || scene.title}
        </button>
      `).join("");
      window.requestAnimationFrame(() => {
        const activeButton = nav.querySelector(".scene-jump.active");
        if (!activeButton) return;
        const targetLeft = activeButton.offsetLeft - (nav.clientWidth / 2) + (activeButton.clientWidth / 2);
        nav.scrollTo({ left: Math.max(0, targetLeft), behavior: "smooth" });
      });
    }

    function setActiveScene(index) {
      if (activeSceneIndex === index) return;
      activeSceneIndex = index;
      renderSceneNav(index);
    }

    function jumpToScene(index) {
      startedAt = Date.now() - (index * sceneMs);
      paused = false;
      renderedSceneIndex = -1;
      document.getElementById("pauseBtn").textContent = "Pause";
      clearInterval(timer);
      timer = setInterval(render, 250);
      render();
    }

    function render() {
      if (paused) return;
      const elapsed = Date.now() - startedAt;
      const index = Math.min(Math.floor(elapsed / sceneMs), scenes.length - 1);
      const scene = scenes[index];
      setActiveScene(index);
      document.getElementById("title").textContent = scene.title;
      document.getElementById("text").textContent = scene.text;
      if (renderedSceneIndex !== index) {
        renderedSceneIndex = index;
        document.getElementById("screen").innerHTML = renderScreen(scene);
      }
      document.getElementById("progress").style.width =
        Math.min(100, (elapsed / (sceneMs * scenes.length)) * 100) + "%";

      if (elapsed >= sceneMs * scenes.length) {
        clearInterval(timer);
      }
    }

    function restart() {
      startedAt = Date.now();
      paused = false;
      document.getElementById("pauseBtn").textContent = "Pause";
      clearInterval(timer);
      activeSceneIndex = -1;
      renderedSceneIndex = -1;
      renderSceneNav(0);
      timer = setInterval(render, 250);
      render();
    }

    function togglePause() {
      paused = !paused;
      const button = document.getElementById("pauseBtn");
      if (paused) {
        pauseAt = Date.now();
        button.textContent = "Resume";
      } else {
        startedAt += Date.now() - pauseAt;
        button.textContent = "Pause";
      }
    }

    restart();
  </script>
</body>
</html>
