<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yazılım Güncelleme Video Kılavuzu</title>
<link rel="stylesheet" href="update-guide.css?v=5">
<script src="update-guide.js?v=4" defer></script>
</head>
<body>
<main class="wrap">
<nav><a href="updates-clock.html">← Güncelleme Dosyaları</a><a href="firmware-update-video-en.html" lang="en">English</a></nav>
<h1>Yazılım Güncelleme Video Kılavuzu</h1>
<p class="lead">Gerçek saat ekranlarıyla adım adım güncelleme.</p>
<p class="warning">Yükleme boyunca elektriği kesmeyin ve dosya aktarımı bitmeden tarayıcıyı kapatmayın.</p>
<section class="guide" aria-label="Yazılım Güncelleme Video Kılavuzu">
<div class="step-copy" aria-live="polite">
<p id="stepNumber" class="step-number"></p>
<h2 id="title"></h2><p id="copy"></p><p id="note" class="note"></p>
</div>
<figure>
<div id="completion" class="completion" hidden>
<div class="complete-heading">YUKLEME TAMAMLANDI / UPDATE COMPLETE</div>
<div class="completion-grid">
<section lang="tr"><span>TURKCE</span><h3 id="completeTr"></h3></section>
<section lang="en"><span>ENGLISH</span><h3 id="completeEn"></h3></section>
</div>
</div>
<div id="example" class="example" hidden>
<div id="filesExample"><h3>Örnek dosya adları</h3><p><code>DigitalClock-Firmware-VX.X.X.bin</code></p><p><code>DigitalClock-FileSystem-VX.X.X.bin</code></p></div>
<div id="wifiExample" hidden><h3>WiFi</h3><p class="network">DIGITAL-CLOCK-XXXXXX</p><p>Varsayılan şifre: <strong>12345678</strong></p><p>Ağ adının son kısmı her saatte farklıdır.</p></div>
</div>
<div id="shot" class="shot"><a id="imageLink" href="images/update/update-controls.jpg" target="_blank" rel="noopener"><img id="screen" src="images/update/update-controls.jpg" alt="" width="960" height="413"></a><span class="highlight" aria-hidden="true"></span><span class="pointer" aria-hidden="true">↑</span></div>
<figcaption><a id="enlarge" href="images/update/update-page.jpg" target="_blank" rel="noopener">Görüntüyü büyüt</a></figcaption></figure>
</section>
<div class="controls"><button id="previous" type="button">Geri</button><button id="play" type="button" aria-pressed="false">Oynat</button><button id="next" type="button">İleri</button></div>
<progress id="progress" max="10" value="1"></progress>
<div id="stepList" class="step-list"></div>
<p class="footer">Görüntüler bağlı dijital duvar saatinin gerçek güncelleme sayfasından alınmıştır.</p>
<noscript><p><a href="updates.html">Güncelleme Dosyaları</a></p></noscript>
</main>
</body>
</html>
