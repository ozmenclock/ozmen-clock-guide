<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Update Video Guide</title>
<link rel="stylesheet" href="update-guide.css?v=5">
<script src="update-guide.js?v=4" defer></script>
</head>
<body>
<main class="wrap">
<nav><a href="updates-clock.html">← Update Downloads</a><a href="firmware-update-video-tr.html" lang="tr">Türkçe</a></nav>
<h1>Software Update Video Guide</h1>
<p class="lead">A step-by-step update guide with real clock screenshots.</p>
<p class="warning">Keep the power connected during uploads and leave the browser open until the file transfer finishes.</p>
<section class="guide" aria-label="Software Update Video Guide">
<div class="step-copy" aria-live="polite">
<p id="stepNumber" class="step-number"></p>
<h2 id="title"></h2><p id="copy"></p><p id="note" class="note"></p>
</div>
<figure>
<div id="completion" class="completion" hidden>
<div class="complete-heading">YUKLEME TAMAMLANDI / UPDATE COMPLETE</div>
<div class="completion-grid">
<section lang="tr"><span>TURKCE</span><h3 id="completeTr"></h3></section>
<section lang="en"><span>ENGLISH</span><h3 id="completeEn"></h3></section>
</div>
</div>
<div id="example" class="example" hidden>
<div id="filesExample"><h3>Example file names</h3><p><code>DigitalClock-Firmware-VX.X.X.bin</code></p><p><code>DigitalClock-FileSystem-VX.X.X.bin</code></p></div>
<div id="wifiExample" hidden><h3>WiFi</h3><p class="network">DIGITAL-CLOCK-XXXXXX</p><p>Default password: <strong>12345678</strong></p><p>The last part of the network name is different on each clock.</p></div>
</div>
<div id="shot" class="shot"><a id="imageLink" href="#"><img id="screen" src="images/update/update-controls.jpg" alt="" width="960" height="413"></a><span class="file-picker-preview"><span class="choose-file-label">Choose File</span><span>No file chosen</span></span><span class="file-picker-preview secondary"><span class="choose-file-label">Choose File</span><span>No file chosen</span></span><span class="highlight" aria-hidden="true"></span><span class="pointer" aria-hidden="true">↑</span></div>
<figcaption><a id="enlarge" href="#">Enlarge image</a></figcaption></figure>
</section>
<div class="controls"><button id="previous" type="button">Previous</button><button id="play" type="button" aria-pressed="false">Play</button><button id="next" type="button">Next</button></div>
<progress id="progress" max="10" value="1"></progress>
<div id="stepList" class="step-list"></div>
<p class="footer">Images were captured from the connected digital wall clock's actual update page.</p>
<noscript><p><a href="updates.html">Update Downloads</a></p></noscript>
</main>
</body>
</html>
