<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ozmen Clock Kullanım Videosu</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #151b22;
      --soft: #1d2630;
      --line: #2b3642;
      --text: #f3f7fb;
      --muted: #9aa8b5;
      --green: #21d07a;
      --red: #ff3030;
      --blue: #4aa3ff;
      --yellow: #ffd24a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding-bottom: 118px;
      background: radial-gradient(circle at top, #18222e 0, var(--bg) 48%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .stage {
      width: min(1100px, 100vw);
      min-height: min(620px, 100vh);
      padding: 28px;
      display: grid;
      grid-template-columns: 1fr 390px;
      gap: 28px;
      align-items: center;
    }

    .copy h1 {
      margin: 0 0 12px;
      font-size: 46px;
      line-height: 1.05;
      letter-spacing: 0;
    }

    .copy p {
      margin: 0;
      color: var(--muted);
      font-size: 21px;
      line-height: 1.45;
      white-space: pre-line;
    }

    .scene-nav {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 14px;
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      gap: 8px;
      max-height: 88px;
      overflow: auto;
      padding: 10px 12px;
      border: 1px solid rgba(43, 54, 66, .9);
      border-radius: 12px;
      background: rgba(6, 10, 15, .94);
      z-index: 30;
    }

    .scene-jump {
      min-height: 50px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(21, 27, 34, .86);
      color: #cfe3f4;
      cursor: pointer;
      text-align: left;
      font: inherit;
      font-size: 12px;
      line-height: 1.2;
    }

    .scene-jump b {
      display: block;
      color: white;
      font-size: 13px;
      margin-bottom: 2px;
    }

    .scene-jump.active {
      border-color: var(--green);
      background: rgba(33, 208, 122, .16);
      color: #8dffc5;
    }

    .badge {
      display: inline-flex;
      margin-bottom: 18px;
      padding: 8px 12px;
      border: 1px solid rgba(33, 208, 122, .45);
      border-radius: 999px;
      background: rgba(33, 208, 122, .12);
      color: #8dffc5;
      font-weight: 700;
    }

    .phone {
      width: 390px;
      min-height: 700px;
      padding: 14px;
      border: 1px solid #303b47;
      border-radius: 32px;
      background: #05080c;
      box-shadow: 0 24px 90px rgba(0, 0, 0, .55);
    }

    .screen {
      min-height: 670px;
      overflow: hidden;
      border-radius: 24px;
      background: #0b0f14;
      border: 1px solid #1f2a35;
      position: relative;
    }

    .statusbar {
      height: 30px;
      padding: 8px 18px 0;
      display: flex;
      justify-content: space-between;
      color: #dceeff;
      font-size: 12px;
      background: #080c11;
    }

    .home {
      min-height: 640px;
      padding: 26px 20px 92px;
      background:
        linear-gradient(145deg, rgba(74, 163, 255, .22), transparent 42%),
        linear-gradient(330deg, rgba(33, 208, 122, .18), transparent 48%),
        #10161f;
    }

    .home-time {
      margin: 18px 0 34px;
      font-size: 52px;
      font-weight: 800;
      line-height: 1;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px 12px;
    }

    .app-icon {
      display: grid;
      gap: 7px;
      place-items: center;
      color: white;
      font-size: 11px;
      text-align: center;
    }

    .icon-box {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: #1f2a35;
      font-size: 28px;
      font-weight: 800;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), 0 8px 18px rgba(0, 0, 0, .18);
    }

    .settings-app { background: linear-gradient(145deg, #8b98a6, #4d5965); }
    .browser-app { background: linear-gradient(145deg, #51b8ff, #1268d6); }
    .clock-app { background: linear-gradient(145deg, #ff4a4a, #9b1111); }
    .mail-app { background: linear-gradient(145deg, #56d88e, #128244); }

    .dock {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      border-radius: 22px;
      background: rgba(255, 255, 255, .12);
      backdrop-filter: blur(10px);
    }

    .tap {
      outline: 3px solid var(--yellow);
      outline-offset: 4px;
      transform: scale(1.04);
    }

    .settings-page,
    .browser-page,
    .clock-page {
      min-height: 640px;
      padding: 14px;
      background: #0c1117;
    }

    .shot-page {
      min-height: 640px;
      height: 640px;
      overflow: hidden;
      background: #060a0f;
      position: relative;
    }

    .settings-shot {
      width: 100%;
      height: auto;
      display: block;
      animation: shotPan 6s ease-in-out both;
    }

    @keyframes shotPan {
      0%, 18% { transform: translateY(0); }
      82%, 100% { transform: translateY(calc(640px - 100%)); }
    }

    .page-title {
      margin: 8px 2px 18px;
      font-size: 27px;
      font-weight: 800;
    }

    .settings-row,
    .wifi-row {
      min-height: 56px;
      margin-bottom: 10px;
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #141c25;
    }

    .settings-row b,
    .wifi-row b {
      display: block;
      color: white;
      font-size: 15px;
    }

    .settings-row span,
    .wifi-row span {
      color: var(--muted);
      font-size: 12px;
    }

    .mini-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: #263241;
      color: white;
      font-weight: 800;
    }

    .wifi-bars {
      color: var(--green);
      font-weight: 800;
    }

    .card .wifi-row {
      grid-template-columns: 1fr auto;
    }

    .password-box {
      margin: 18px 0 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #141c25;
    }

    .password-box label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .password-field {
      padding: 13px;
      border-radius: 10px;
      background: #080c11;
      border: 1px solid #334150;
      font-size: 18px;
      letter-spacing: 2px;
    }

    .phone-button {
      padding: 13px 15px;
      border-radius: 12px;
      text-align: center;
      background: #1477ff;
      color: white;
      font-weight: 800;
    }

    .addressbar {
      margin: 8px 0 14px;
      padding: 12px;
      border-radius: 999px;
      background: #111a23;
      border: 1px solid var(--line);
      color: #dceeff;
      font-size: 15px;
    }

    .browser-shell {
      min-height: 640px;
      background: #f1f3f4;
      color: #1f2328;
      padding: 0;
    }

    .browser-top {
      height: 68px;
      padding: 10px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid #d4d7db;
      background: #ffffff;
    }

    .browser-icons {
      display: flex;
      gap: 6px;
      color: #5f6872;
      font-weight: 800;
    }

    .browser-url {
      min-height: 38px;
      padding: 10px 13px;
      border: 2px solid #1a73e8;
      border-radius: 999px;
      background: #eef3f8;
      color: #202124;
      font-size: 15px;
      box-shadow: 0 0 0 3px rgba(26, 115, 232, .15);
    }

    .browser-go {
      width: 42px;
      height: 38px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: #1a73e8;
      color: white;
      font-weight: 800;
    }

    .browser-content {
      min-height: 572px;
      padding: 46px 22px;
      display: grid;
      align-content: start;
      gap: 16px;
      background: linear-gradient(#ffffff, #eef3f8);
    }

    .browser-card {
      padding: 18px;
      border: 1px solid #d4d7db;
      border-radius: 14px;
      background: white;
      box-shadow: 0 10px 30px rgba(31, 35, 40, .08);
    }

    .setup-preview {
      min-height: 640px;
      padding: 18px 14px;
      background: linear-gradient(180deg, #101820 0%, #0b0f14 220px);
      color: var(--text);
      overflow: hidden;
    }

    .setup-preview h2 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    .setup-preview p {
      margin: 0;
      color: var(--muted);
      line-height: 1.35;
      font-size: 13px;
    }

    .setup-card-demo {
      margin-top: 13px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #151b22;
    }

    .setup-card-demo b {
      display: block;
      margin-bottom: 7px;
    }

    .setup-field-demo {
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #334150;
      border-radius: 8px;
      background: #0b1118;
      color: #dceeff;
      font-size: 13px;
    }

    .setup-note-demo {
      margin-top: 9px;
      padding: 9px 10px;
      border: 1px solid rgba(155, 214, 255, .18);
      border-radius: 8px;
      background: rgba(155, 214, 255, .07);
      color: #b9d7ea;
      font-size: 12px;
      line-height: 1.35;
    }

    .topbar {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: #101720;
    }

    .topbar h2 {
      margin: 0 0 4px;
      font-size: 22px;
    }

    .small {
      color: var(--muted);
      font-size: 13px;
    }

    .preview {
      margin: 16px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      text-align: center;
      background: #05080c;
      position: relative;
    }

    .time {
      color: var(--red);
      font-size: 46px;
      font-weight: 800;
      line-height: 1;
    }

    .temp {
      position: absolute;
      right: 10px;
      top: 8px;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      background: #111820;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 0 16px 12px;
    }

    .tab {
      padding: 9px 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: var(--soft);
      text-align: center;
      font-size: 12px;
    }

    .tab.active {
      color: white;
      border-color: var(--green);
    }

    .panel-stack {
      margin: 0 16px 16px;
      display: grid;
      gap: 12px;
    }

    .card {
      margin: 0 16px 16px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }

    .panel-stack .card {
      margin: 0;
    }

    .form-label {
      display: block;
      color: #dceeff;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .fake-input,
    .fake-select {
      width: 100%;
      min-height: 39px;
      padding: 10px 12px;
      border: 1px solid #344150;
      border-radius: 8px;
      background: #090f15;
      color: white;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .segment {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      text-align: center;
      background: #101820;
      color: var(--muted);
      font-weight: 700;
    }

    .segment.active {
      color: white;
      border-color: var(--green);
      background: rgba(33, 208, 122, .12);
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .wifi-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .wifi-detail {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0e151c;
    }

    .wifi-detail span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 4px;
    }

    .wifi-detail b {
      font-size: 13px;
    }

    .label {
      color: white;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .control {
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0e151c;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .button {
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      background: rgba(33, 208, 122, .14);
      border: 1px solid rgba(33, 208, 122, .7);
      color: #8dffc5;
      font-weight: 800;
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .swatch {
      height: 44px;
      border-radius: 8px;
      border: 2px solid #34404c;
    }

    .range {
      height: 9px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--green) 72%, #29333e 72%);
      margin: 12px 0 14px;
    }

    .caption {
      display: none;
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      padding: 13px 14px;
      border: 1px solid rgba(74, 163, 255, .45);
      border-radius: 12px;
      background: rgba(8, 13, 18, .92);
      color: #dceeff;
      font-size: 15px;
      line-height: 1.35;
    }

    .progress {
      position: fixed;
      left: 0;
      bottom: 0;
      height: 5px;
      width: 0;
      background: var(--green);
      transition: width .25s linear;
    }

    .controls {
      position: fixed;
      right: 14px;
      top: 14px;
      display: flex;
      gap: 8px;
      z-index: 40;
    }

    .controls button {
      width: auto;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: #1b2530;
      cursor: pointer;
    }

    @media (max-width: 820px) {
      body {
        display: block;
        min-height: 100vh;
        padding: 64px 0 124px;
      }

      .stage {
        width: 100%;
        min-height: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: stretch;
      }

      .phone {
        order: 1;
        width: min(100%, 390px);
        min-height: 0;
        margin: 0 auto;
        padding: 10px;
        border-radius: 28px;
      }

      .screen {
        min-height: min(650px, calc(100vh - 245px));
        border-radius: 21px;
      }

      .copy {
        order: 2;
        width: min(100%, 390px);
        margin: 0 auto;
        padding: 14px;
        border: 1px solid rgba(43, 54, 66, .9);
        border-radius: 12px;
        background: rgba(21, 27, 34, .72);
      }

      .badge {
        margin-bottom: 10px;
        padding: 6px 10px;
        font-size: 13px;
      }

      .copy h1 {
        font-size: 25px;
        line-height: 1.15;
        margin-bottom: 8px;
      }

      .copy p {
        font-size: 15px;
        line-height: 1.5;
      }

      .controls {
        top: 10px;
        left: 10px;
        right: 10px;
        justify-content: flex-end;
      }

      .controls button {
        padding: 8px 10px;
        font-size: 13px;
      }

      .scene-nav {
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        grid-template-columns: none;
        gap: 8px;
        max-height: none;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 10px 12px 14px;
        border-radius: 14px 14px 0 0;
        scrollbar-width: thin;
      }

      .scene-jump {
        flex: 0 0 132px;
        min-height: 52px;
        font-size: 12px;
      }
    }

    @media (max-width: 420px) {
      .stage { padding: 10px; }
      .phone {
        padding: 8px;
        border-radius: 24px;
      }
      .screen {
        min-height: min(620px, calc(100vh - 230px));
        border-radius: 18px;
      }
      .statusbar {
        padding-left: 14px;
        padding-right: 14px;
      }
      .scene-jump { flex-basis: 118px; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="copy">
      <div class="badge" id="badge">Ozmen Clock</div>
      <h1 id="title">Dijital Saat Kurulumu</h1>
      <p id="text">Telefonunuzdan saatin WiFi ağına bağlanarak tüm ayarları kolayca yapabilirsiniz.</p>
    </section>

    <section class="phone" aria-label="Telefon ekranı">
      <div class="screen" id="screen"></div>
    </section>
  </main>

  <div class="scene-nav" id="sceneNav" aria-label="Video bölümleri"></div>

  <div class="controls">
    <button type="button" onclick="restart()">Baştan oynat</button>
    <button type="button" onclick="togglePause()" id="pauseBtn">Duraklat</button>
  </div>
  <div class="progress" id="progress"></div>

  <script>
    const tabs = ["Görünüm", "Saat", "Sıcaklık", "Geri Sayım", "Skor", "Kronometre", "Gece Işığı", "WiFi", "Araçlar"];
    const scenes = [
      {
        type: "home",
        nav: "Ayarlar",
        title: "Telefon ana menüsünden başlayın",
        text: "Saat ayar ekranına ulaşmak için önce telefonunuzdan saatin kendi WiFi ağına bağlanmanız gerekir.",
        caption: "Telefonun ana ekranında Ayarlar uygulamasını bulun ve açın. İlk adım WiFi ağına bağlanmaktır.",
        tap: "settings"
      },
      {
        type: "settings",
        nav: "WiFi menüsü",
        title: "WiFi ayarlarına girin",
        text: "Ayarlar menüsünde kablosuz ağların listelendiği WiFi bölümünü açın.",
        caption: "WiFi bölümünde telefonun çevrede gördüğü ağlar listelenir. Saatin ağı da bu listede görünür.",
        tap: "wifi"
      },
      {
        type: "wifiList",
        nav: "Saat ağı",
        title: "Saatin WiFi ağını seçin",
        text: "Listede DIGITAL-CLOCK ile başlayan ağı bulun. Bu ağ, saatin ayar ekranına bağlanmak için kullanılır.",
        caption: "Saatin ağı genellikle DIGITAL-CLOCK-xxxx şeklinde görünür. Varsayılan şifre: 12345678",
        tap: "clockWifi"
      },
      {
        type: "password",
        nav: "Şifre",
        title: "Saat WiFi şifresini girin",
        text: "Şifre ekranı geldiğinde varsayılan şifreyi girin ve Bağlan butonuna basın.",
        caption: "Varsayılan saat WiFi şifresi: 12345678. Bağlanırken telefon kısa süreli kopup tekrar bağlanabilir; bu normaldir. Bağlantıdan sonra telefonda internet olmayabilir.",
      },
      {
        type: "home",
        nav: "Tarayıcı",
        title: "Ana menüye dönün",
        text: "Telefon saat ağına bağlandıktan sonra ana menüye dönün ve internet tarayıcısını açın.",
        caption: "Bu aşamada telefon saatin WiFi ağına bağlı kalmalıdır. Ana ekrandan İnternet Tarayıcısı uygulamasına girin.",
        tap: "browser"
      },
      {
        type: "browserAddress",
        nav: "192.168.4.1",
        title: "192.168.4.1 adresini açın",
        text: "Tarayıcı adres çubuğuna 192.168.4.1 yazın. Bu adres saatin yerel ayar ekranıdır.",
        caption: "Adres çubuğuna 192.168.4.1 yazıp giriş yaptığınızda dijital saatin ayar paneli açılır.",
      },
      {
        type: "firstSetup",
        nav: "İlk kurulum",
        title: "İlk kurulum ekranı",
        text: "Saat ilk kez ayarlanıyorsa 192.168.4.1 açıldığında ilk kurulum ekranı gelir.\n\nBu ekranda dil seçimi yapılır, saat bölgesi belirlenir, istenirse cihaz WiFi şifresi değiştirilir ve ortam WiFi ağı seçilerek saat internete bağlanır.\n\nBilgiler girildikten sonra Kaydet ve Devam Et butonuna basılır. Kurulum tamamlandığında ayarların kaydedildiğini gösteren kısa bir bilgilendirme görünür ve normal ayar ekranı açılır.",
        caption: "WiFi ağına bağlanırken kısa süreli kopma yaşanabilir. Bu normaldir; birkaç saniye bekleyip gerekirse 192.168.4.1 sayfasını tekrar açabilirsiniz.",
      },
      {
        type: "image",
        nav: "Görünüm",
        title: "Görünüm ayarları",

    const sceneMs = 7600;
    let startedAt = Date.now();
    let paused = false;
    let pauseAt = 0;
    let timer = null;
    let activeSceneIndex = -1;
    let renderedSceneIndex = -1;

    function statusbar() {
      return `<div class="statusbar"><b>20:45</b><span>WiFi 100%</span></div>`;
    }

    function homeScreen(scene) {
      const settingsTap = scene.tap === "settings" ? " tap" : "";
      const browserTap = scene.tap === "browser" ? " tap" : "";
      return `${statusbar()}
        <div class="home">
          <div class="home-time">20:45</div>
          <div class="app-grid">
            <div class="app-icon${settingsTap}"><div class="icon-box settings-app">A</div><span>Ayarlar</span></div>
            <div class="app-icon${browserTap}"><div class="icon-box browser-app">İ</div><span>İnternet Tarayıcısı</span></div>
            <div class="app-icon"><div class="icon-box clock-app">S</div><span>Saat</span></div>
            <div class="app-icon"><div class="icon-box mail-app">M</div><span>Mesajlar</span></div>
          </div>
          <div class="dock">
            <div class="app-icon"><div class="icon-box browser-app">T</div></div>
            <div class="app-icon"><div class="icon-box settings-app">A</div></div>
            <div class="app-icon"><div class="icon-box clock-app">S</div></div>
            <div class="app-icon"><div class="icon-box mail-app">M</div></div>
          </div>
        </div>
        <div class="caption">${scene.caption}</div>`;
    }

    function settingsScreen(scene) {
      const wifiTap = scene.tap === "wifi" ? " tap" : "";
      return `${statusbar()}
        <div class="settings-page">
          <div class="page-title">Ayarlar</div>
          <div class="settings-row${wifiTap}"><div class="mini-icon">W</div><div><b>WiFi</b><span>Kablosuz ağlar</span></div><div class="wifi-bars">></div></div>
          <div class="settings-row"><div class="mini-icon">B</div><div><b>Bluetooth</b><span>Kapalı</span></div><div>></div></div>
          <div class="settings-row"><div class="mini-icon">E</div><div><b>Ekran</b><span>Parlaklık ve tema</span></div><div>></div></div>
          <div class="settings-row"><div class="mini-icon">G</div><div><b>Genel</b><span>Telefon ayarları</span></div><div>></div></div>
        </div>
        <div class="caption">${scene.caption}</div>`;
    }

    function wifiListScreen(scene) {
      const clockTap = scene.tap === "clockWifi" ? " tap" : "";
      return `${statusbar()}
        <div class="settings-page">
          <div class="page-title">WiFi</div>
          <div class="wifi-row${clockTap}"><div class="mini-icon">D</div><div><b>DIGITAL-CLOCK-4FDF02</b><span>Saat ayar ağı - Şifre: 12345678</span></div><div class="wifi-bars">***</div></div>
          <div class="wifi-row"><div class="mini-icon">E</div><div><b>Ev_WiFi</b><span>Güvenli ağ</span></div><div class="wifi-bars">***</div></div>
          <div class="wifi-row"><div class="mini-icon">O</div><div><b>Ofis_WiFi</b><span>Güvenli ağ</span></div><div class="wifi-bars">**</div></div>
          <div class="wifi-row"><div class="mini-icon">M</div><div><b>Misafir</b><span>Açık ağ</span></div><div class="wifi-bars">*</div></div>
        </div>
        <div class="caption">${scene.caption}</div>`;
    }

    function passwordScreen(scene) {
      return `${statusbar()}
        <div class="settings-page">
          <div class="page-title">DIGITAL-CLOCK-4FDF02</div>
          <div class="password-box">
            <label>Varsayılan WiFi şifresi</label>

    function browserAddressScreen(scene) {
      return `${statusbar()}
        <div class="browser-shell">
          <div class="browser-top">

    function firstSetupScreen(scene) {
      return `<div class="setup-preview">

        <div class="setup-card-demo">
          <b>Bölge ve saat</b>

        </div>
        <div class="setup-card-demo">
          <b>Cihaz WiFi şifresi</b>
          <p>Varsayılan şifreyi bırakabilir veya yeni şifre girebilirsiniz.</p>
          <div class="setup-field-demo">12345678</div>
        </div>
        <div class="setup-card-demo">
          <b>Ortam WiFi bağlantısı</b>
          <div class="setup-field-demo">Ev_WiFi_****</div>
          <div class="setup-field-demo">WiFi şifresi</div>
          <div class="setup-note-demo">WiFi ağına bağlanırken kısa süreli kopma yaşanabilir. Bu normaldir.</div>
          <div class="phone-button tap" style="margin-top:10px">Kaydet ve Devam Et</div>
          <div class="setup-note-demo">Kurulum tamamlandı. Ayarlar kaydedildi.</div>
        </div>
      </div>
      <div class="caption">${scene.caption}</div>`;
    }

    function imageScreen(scene) {
      const shortClass = scene.short ? " short" : "";
      return `<div class="shot-page">
          <img class="settings-shot${shortClass}" src="${scene.image}" alt="${scene.title}">
        </div>
        <div class="caption">${scene.caption}</div>`;
    }

    function renderTabs(active) {
      return tabs.map((tab) =>
        `<div class="tab ${tab === active ? "active" : ""}">${tab}</div>`
      ).join("");
    }

    function clockPanelScreen(scene, elapsed) {
      const seconds = Math.floor(elapsed / 1000);
      const clock = "20:45:" + String(12 + (seconds % 48)).padStart(2, "0");
      return `${statusbar()}
        <div class="clock-page">
          <div class="topbar">
            <h2>Dijital Saat</h2>
            <div class="small">WiFi: DIGITAL-CLOCK | 192.168.4.1</div>
          </div>
          <div class="preview">
            <div class="temp">24.5 C</div>
            <div class="time">${clock}</div>
            <div class="small">21.05.2026</div>
          </div>
          <div class="tabs">${renderTabs(scene.tab)}</div>
          <div class="panel-stack">${scene.card}</div>
        </div>
        <div class="caption">${scene.caption}</div>`;
    }

    function renderScreen(scene, elapsed) {
      if (scene.type === "home") return homeScreen(scene);
      if (scene.type === "settings") return settingsScreen(scene);
      if (scene.type === "wifiList") return wifiListScreen(scene);
      if (scene.type === "password") return passwordScreen(scene);
      if (scene.type === "browserAddress") return browserAddressScreen(scene);
      if (scene.type === "firstSetup") return firstSetupScreen(scene);
      if (scene.type === "image") return imageScreen(scene);
      return clockPanelScreen(scene, elapsed);
    }

    function renderSceneNav(activeIndex) {
      const nav = document.getElementById("sceneNav");
      nav.innerHTML = scenes.map((scene, index) => `
        <button type="button" class="scene-jump ${index === activeIndex ? "active" : ""}" onclick="jumpToScene(${index})">
          <b>${String(index + 1).padStart(2, "0")}</b>${scene.nav || scene.title}
        </button>
      `).join("");
      window.requestAnimationFrame(() => {
        const activeButton = nav.querySelector(".scene-jump.active");
        if (!activeButton) return;
        const targetLeft = activeButton.offsetLeft - (nav.clientWidth / 2) + (activeButton.clientWidth / 2);
        nav.scrollTo({ left: Math.max(0, targetLeft), behavior: "smooth" });
      });
    }

    function setActiveScene(index) {
      if (activeSceneIndex === index) return;
      activeSceneIndex = index;
      renderSceneNav(index);
    }

    function jumpToScene(index) {
      startedAt = Date.now() - (index * sceneMs);
      paused = false;
      renderedSceneIndex = -1;
      document.getElementById("pauseBtn").textContent = "Duraklat";
      clearInterval(timer);
      timer = setInterval(render, 250);
      render();
    }

    function render() {
      if (paused) return;
      const elapsed = Date.now() - startedAt;
      const index = Math.min(Math.floor(elapsed / sceneMs), scenes.length - 1);
      const scene = scenes[index];
      const sceneElapsed = elapsed - index * sceneMs;
      setActiveScene(index);
      document.getElementById("title").textContent = scene.title;
      document.getElementById("text").textContent = scene.text;
      if (renderedSceneIndex !== index) {
        renderedSceneIndex = index;
        document.getElementById("screen").innerHTML = renderScreen(scene, elapsed);
      }
      document.getElementById("progress").style.width =
        Math.min(100, (elapsed / (sceneMs * scenes.length)) * 100) + "%";

      if (elapsed >= sceneMs * scenes.length) {
        clearInterval(timer);
      }
    }

    function restart() {
      startedAt = Date.now();
      paused = false;
      document.getElementById("pauseBtn").textContent = "Duraklat";
      clearInterval(timer);
      activeSceneIndex = -1;
      renderedSceneIndex = -1;
      renderSceneNav(0);
      timer = setInterval(render, 250);
      render();
    }

    function togglePause() {
      paused = !paused;
      const button = document.getElementById("pauseBtn");
      if (paused) {
        pauseAt = Date.now();
        button.textContent = "Devam";
      } else {
        startedAt += Date.now() - pauseAt;
        button.textContent = "Duraklat";
      }
    }

    restart();
  </script>
